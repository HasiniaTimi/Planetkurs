<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #000000 0%, #DD0000 50%, #FFD700 100%);
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .header {
      background: linear-gradient(to right, #000000, #DD0000, #FFD700);
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      justify-content: center;
    }
    
    .stat-card {
      min-width: 200px;
      background: linear-gradient(135deg, #FFD700, #FFC700);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 36px;
      font-weight: bold;
      color: #000000;
    }
    
    .stat-label {
      font-size: 16px;
      color: #333;
      margin-top: 5px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    th {
      background: #DD0000;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: bold;
      position: sticky;
      top: 0;
    }
    
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
    }
    
    tr:nth-child(even) {
      background: #FFE4E1;
    }
    
    tr:hover {
      background: #FFB6B9;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      background: #000000;
      color: #FFD700;
      margin-right: 3px;
    }
    
    .table-container {
      max-height: 450px;
      overflow-y: auto;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>👨‍🏫 LISTE COMPLÈTE DES PROFESSEURS</h2>
    </div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalProfs">-</div>
        <div class="stat-label">Total Professeurs</div>
      </div>
    </div>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom Complet</th>
            <th>Niveau(x) Enseigné(s)</th>
            <th>Téléphone</th>
            <th>Email</th>
            <th>Adresse</th>
            <th>Date Embauche</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td colspan="7" class="loading">⏳ Chargement des données...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <script>
    window.onload = function() {
      google.script.run
        .withSuccessHandler(afficherProfesseurs)
        .withFailureHandler(function(error) {
          document.getElementById('tbody').innerHTML = 
            '<tr><td colspan="7" class="loading">❌ Erreur: ' + error.message + '</td></tr>';
        })
        .obtenirTousLesProfesseurs();
    };
    
    function afficherProfesseurs(professeurs) {
      if (professeurs.length === 0) {
        document.getElementById('tbody').innerHTML = 
          '<tr><td colspan="7" class="loading">Aucun professeur enregistré</td></tr>';
        return;
      }
      
      document.getElementById('totalProfs').textContent = professeurs.length;
      
      var html = '';
      professeurs.forEach(function(prof) {
        var dateEmbauche = prof.dateEmbauche ? new Date(prof.dateEmbauche).toLocaleDateString('fr-FR') : 'N/A';
        
        // Afficher les niveaux comme des badges
        var niveaux = prof.niveau.split(',').map(function(n) {
          return '<span class="badge">' + n.trim() + '</span>';
        }).join(' ');
        
        html += `
          <tr>
            <td><strong>${prof.id}</strong></td>
            <td>${prof.nom} ${prof.prenom}</td>
            <td>${niveaux}</td>
            <td>${prof.telephone}</td>
            <td>${prof.email || '-'}</td>
            <td>${prof.adresse}</td>
            <td>${dateEmbauche}</td>
          </tr>
        `;
      });
      
      document.getElementById('tbody').innerHTML = html;
    }
  </script>
</body>
</html>
