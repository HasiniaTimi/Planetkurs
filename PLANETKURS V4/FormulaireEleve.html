<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #2C3E50 0%, #C0392B 50%, #F39C12 100%);
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      max-width: 550px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(to right, #34495E, #E74C3C, #F1C40F);
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #E74C3C;
      border-radius: 5px;
      font-size: 14px;
      transition: all 0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #F1C40F;
      box-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .required {
      color: #E74C3C;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #E74C3C, #34495E);
      color: #F1C40F;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #34495E, #E74C3C);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary {
      background: #F1C40F;
      color: #2C3E50;
      border: 2px solid #34495E;
    }

    .btn-secondary:hover {
      background: #F39C12;
      transform: translateY(-2px);
    }

    .matricule-display {
      background: linear-gradient(135deg, #34495E, #E74C3C);
      color: #F1C40F;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .message.success {
      background: #4CAF50;
      color: white;
    }

    .message.error {
      background: #E74C3C;
      color: white;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row .form-group {
      flex: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h2>🇩🇪 INSCRIPTION ÉLÈVE - PLANETKURS</h2>
    </div>

    <div id="message" class="message"></div>

    <div id="matriculeDisplay" class="matricule-display" style="display:none;">
      N° Matricule: <span id="matriculeValue"></span>
    </div>

    <form id="eleveForm">
      <div class="row">
        <div class="form-group">
          <label for="nom">Nom <span class="required">*</span></label>
          <input type="text" id="nom" name="nom" required placeholder="Wagner">
        </div>

        <div class="form-group">
          <label for="prenom">Prénom <span class="required">*</span></label>
          <input type="text" id="prenom" name="prenom" required placeholder="Frank">
        </div>
      </div>

      <div class="form-group">
        <label for="adresse">Adresse <span class="required">*</span></label>
        <input type="text" id="adresse" name="adresse" required placeholder="Lot II...">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="telephone">Téléphone <span class="required">*</span></label>
          <input type="tel" id="telephone" name="telephone" required placeholder="+261 XX XX XXX XX">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="exemple@email.com">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="niveau">Niveau <span class="required">*</span></label>
          <select id="niveau" name="niveau" required>
            <option value="">-- Sélectionner --</option>
            <option value="A1">A1 - Débutant</option>
            <option value="A2">A2 - Élémentaire</option>
            <option value="B1">B1 - Intermédiaire</option>
            <option value="B2">B2 - Intermédiaire Avancé</option>
          </select>
        </div>

        <div class="form-group">
          <label for="professeur">Professeur Assigné</label>
          <select id="professeur" name="professeur">
            <option value="">-- Aucun --</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes / Remarques</label>
        <textarea id="notes" name="notes" placeholder="Informations supplémentaires..."></textarea>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-primary">✓ ENREGISTRER</button>
        <button type="button" class="btn-secondary" onclick="google.script.host.close()">
          ✗ ANNULER
        </button>
      </div>
    </form>
  </div>

  <script>
    // Charger la liste des professeurs
    window.onload = function () {
      google.script.run
        .withSuccessHandler(function (profs) {
          var select = document.getElementById('professeur');
          profs.forEach(function (prof) {
            var option = document.createElement('option');
            option.value = prof;
            option.textContent = prof;
            select.appendChild(option);
          });
        })
        .obtenirListeProfesseurs();

      // Générer et afficher le matricule
      google.script.run
        .withSuccessHandler(function (matricule) {
          document.getElementById('matriculeValue').textContent = matricule;
          document.getElementById('matriculeDisplay').style.display = 'block';
        })
        .genererMatricule();
    };

    // Gestion de la soumission du formulaire
    document.getElementById('eleveForm').addEventListener('submit', function (e) {
      e.preventDefault();

      var data = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        adresse: document.getElementById('adresse').value,
        telephone: document.getElementById('telephone').value,
        email: document.getElementById('email').value,
        niveau: document.getElementById('niveau').value,
        professeur: document.getElementById('professeur').value,
        notes: document.getElementById('notes').value
      };

      // Désactiver le bouton pendant l'envoi
      var btn = document.querySelector('.btn-primary');
      btn.disabled = true;
      btn.textContent = '⏳ ENREGISTREMENT...';

      google.script.run
        .withSuccessHandler(function (result) {
          var messageDiv = document.getElementById('message');
          messageDiv.className = 'message ' + (result.success ? 'success' : 'error');
          messageDiv.textContent = result.message;
          messageDiv.style.display = 'block';

          if (result.success) {
            // Réinitialiser le formulaire
            document.getElementById('eleveForm').reset();

            // Générer un nouveau matricule
            google.script.run
              .withSuccessHandler(function (matricule) {
                document.getElementById('matriculeValue').textContent = matricule;
              })
              .genererMatricule();

            // Fermer après 2 secondes
            setTimeout(function () {
              google.script.host.close();
            }, 2000);
          }

          btn.disabled = false;
          btn.textContent = '✓ ENREGISTRER';
        })
        .withFailureHandler(function (error) {
          var messageDiv = document.getElementById('message');
          messageDiv.className = 'message error';
          messageDiv.textContent = 'Erreur: ' + error.message;
          messageDiv.style.display = 'block';

          btn.disabled = false;
          btn.textContent = '✓ ENREGISTRER';
        })
        .enregistrerEleve(data);
    });
  </script>
</body>

</html>
