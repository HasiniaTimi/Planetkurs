<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #000000 0%, #DD0000 50%, #FFD700 100%);
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .header {
      background: linear-gradient(to right, #000000, #DD0000, #FFD700);
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .search-box select,
    .search-box input {
      padding: 10px;
      border: 2px solid #DD0000;
      border-radius: 5px;
      font-size: 14px;
    }
    
    .search-box select {
      flex: 0 0 150px;
    }
    
    .search-box input {
      flex: 1;
      min-width: 200px;
    }
    
    .search-box button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #DD0000, #000000);
      color: #FFD700;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .search-box button:hover {
      background: linear-gradient(135deg, #000000, #DD0000);
    }
    
    .results {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .student-card {
      background: #f9f9f9;
      border-left: 5px solid #DD0000;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .student-card:hover {
      border-left-color: #FFD700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid #FFD700;
    }
    
    .student-name {
      font-size: 18px;
      font-weight: bold;
      color: #000000;
    }
    
    .student-matricule {
      background: linear-gradient(135deg, #000000, #DD0000);
      color: #FFD700;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .student-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .info-item {
      font-size: 14px;
    }
    
    .info-label {
      font-weight: bold;
      color: #DD0000;
    }
    
    .student-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    .btn-edit {
      background: #FFD700;
      color: #000000;
    }
    
    .btn-edit:hover {
      background: #FFC700;
    }
    
    .btn-delete {
      background: #DD0000;
      color: white;
    }
    
    .btn-delete:hover {
      background: #BB0000;
    }
    
    .no-results {
      text-align: center;
      padding: 40px;
      color: #666;
      font-style: italic;
    }
    
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
    }
    
    .badge-niveau {
      background: #000000;
      color: #FFD700;
    }
    
    .badge-status {
      background: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🔍 RECHERCHER ÉLÈVE - PLANETKURS</h2>
    </div>
    
    <div class="search-box">
      <select id="searchCriteria">
        <option value="matricule">N° Matricule</option>
        <option value="nom">Nom</option>
        <option value="prenom">Prénom</option>
        <option value="niveau">Niveau</option>
      </select>
      
      <input type="text" id="searchValue" placeholder="Entrez votre recherche...">
      
      <button onclick="rechercher()">🔍 RECHERCHER</button>
    </div>
    
    <div id="results" class="results"></div>
  </div>
  
  <script>
    function rechercher() {
      var critere = document.getElementById('searchCriteria').value;
      var valeur = document.getElementById('searchValue').value.trim();
      
      if (!valeur) {
        alert('Veuillez entrer un critère de recherche');
        return;
      }
      
      document.getElementById('results').innerHTML = '<div class="no-results">⏳ Recherche en cours...</div>';
      
      google.script.run
        .withSuccessHandler(afficherResultats)
        .withFailureHandler(function(error) {
          document.getElementById('results').innerHTML = 
            '<div class="no-results">❌ Erreur: ' + error.message + '</div>';
        })
        .rechercherEleve(critere, valeur);
    }
    
    function afficherResultats(resultats) {
      var resultsDiv = document.getElementById('results');
      
      if (resultats.length === 0) {
        resultsDiv.innerHTML = '<div class="no-results">😕 Aucun élève trouvé</div>';
        return;
      }
      
      var html = '';
      resultats.forEach(function(eleve) {
        html += `
          <div class="student-card">
            <div class="student-header">
              <div class="student-name">${eleve.nom} ${eleve.prenom}</div>
              <div class="student-matricule">${eleve.matricule}</div>
            </div>
            
            <div class="student-info">
              <div class="info-item">
                <span class="info-label">📍 Adresse:</span> ${eleve.adresse}
              </div>
              <div class="info-item">
                <span class="info-label">📞 Téléphone:</span> ${eleve.telephone}
              </div>
              <div class="info-item">
                <span class="info-label">📧 Email:</span> ${eleve.email || 'N/A'}
              </div>
              <div class="info-item">
                <span class="info-label">👨‍🏫 Professeur:</span> ${eleve.professeur || 'Non assigné'}
              </div>
            </div>
            
            <div>
              <span class="badge badge-niveau">${eleve.niveau}</span>
              <span class="badge badge-status">${eleve.statut}</span>
            </div>
            
            ${eleve.notes ? '<div style="margin-top:10px;font-style:italic;color:#666;">💬 ' + eleve.notes + '</div>' : ''}
            
            <div class="student-actions">
              <button class="btn btn-edit" onclick="modifierEleve(${eleve.ligne})">
                ✏️ MODIFIER
              </button>
              <button class="btn btn-delete" onclick="supprimerEleve(${eleve.ligne}, '${eleve.nom} ${eleve.prenom}')">
                🗑️ SUPPRIMER
              </button>
            </div>
          </div>
        `;
      });
      
      resultsDiv.innerHTML = html;
    }
    
    function modifierEleve(ligne) {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            // Afficher le formulaire de modification dans cette même fenêtre
            afficherFormulaireModification(result.eleve);
          } else {
            alert('Erreur: ' + result.message);
          }
        })
        .chargerEleve(ligne);
    }

    function afficherFormulaireModification(eleve) {
      // Masquer les résultats et afficher le formulaire
      document.querySelector('.container').innerHTML = `
        <div class="header">
          <h2>✏️ MODIFIER ÉLÈVE - PLANETKURS</h2>
        </div>

        <div id="message" class="message"></div>

        <form id="modifForm">
          <input type="hidden" id="ligne" value="${eleve.ligne}">

          <div class="form-group">
            <label>N° Matricule</label>
            <input type="text" value="${eleve.matricule}" readonly style="background: #f0f0f0;">
          </div>

          <div class="row">
            <div class="form-group">
              <label for="nom">Nom <span class="required">*</span></label>
              <input type="text" id="nom" value="${eleve.nom}" required>
            </div>

            <div class="form-group">
              <label for="prenom">Prénom <span class="required">*</span></label>
              <input type="text" id="prenom" value="${eleve.prenom}" required>
            </div>
          </div>

          <div class="form-group">
            <label for="adresse">Adresse <span class="required">*</span></label>
            <input type="text" id="adresse" value="${eleve.adresse}" required>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="telephone">Téléphone <span class="required">*</span></label>
              <input type="tel" id="telephone" value="${eleve.telephone}" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" value="${eleve.email || ''}">
            </div>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="niveau">Niveau <span class="required">*</span></label>
              <select id="niveau" required>
                <option value="A1" ${eleve.niveau === 'A1' ? 'selected' : ''}>A1 - Débutant</option>
                <option value="A2" ${eleve.niveau === 'A2' ? 'selected' : ''}>A2 - Élémentaire</option>
                <option value="B1" ${eleve.niveau === 'B1' ? 'selected' : ''}>B1 - Intermédiaire</option>
                <option value="B2" ${eleve.niveau === 'B2' ? 'selected' : ''}>B2 - Intermédiaire Avancé</option>
              </select>
            </div>

            <div class="form-group">
              <label for="professeur">Professeur Assigné</label>
              <select id="professeur">
                <option value="">-- Aucun --</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="notes">Notes / Remarques</label>
            <textarea id="notes">${eleve.notes || ''}</textarea>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-edit">💾 ENREGISTRER</button>
            <button type="button" class="btn btn-delete" onclick="google.script.host.close()">✗ ANNULER</button>
          </div>
        </form>
      `;

      // Charger la liste des professeurs
      google.script.run
        .withSuccessHandler(function(profs) {
          var select = document.getElementById('professeur');
          profs.forEach(function(prof) {
            var option = document.createElement('option');
            option.value = prof;
            option.textContent = prof;
            if (prof === eleve.professeur) option.selected = true;
            select.appendChild(option);
          });
        })
        .obtenirListeProfesseurs();

      // Gérer la soumission
      document.getElementById('modifForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var data = {
          modifier: true,
          ligneModifier: parseInt(document.getElementById('ligne').value),
          matricule: eleve.matricule,
          nom: document.getElementById('nom').value,
          prenom: document.getElementById('prenom').value,
          adresse: document.getElementById('adresse').value,
          telephone: document.getElementById('telephone').value,
          email: document.getElementById('email').value,
          niveau: document.getElementById('niveau').value,
          professeur: document.getElementById('professeur').value,
          notes: document.getElementById('notes').value
        };

        google.script.run
          .withSuccessHandler(function(result) {
            if (result.success) {
              alert('✅ ' + result.message);
              google.script.host.close();
            } else {
              alert('❌ ' + result.message);
            }
          })
          .enregistrerEleve(data);
      });
    }
    
    function supprimerEleve(ligne, nomComplet) {
      if (confirm('Voulez-vous vraiment supprimer l\'élève ' + nomComplet + ' ?\n\nCette action est irréversible!')) {
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            if (result.success) {
              rechercher(); // Rafraîchir les résultats
            }
          })
          .supprimerEleve(ligne);
      }
    }
    
    // Permettre la recherche avec la touche Entrée
    document.getElementById('searchValue').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        rechercher();
      }
    });
  </script>
</body>
</html>
